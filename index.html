<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Twitter 视频解析器</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10">
  <div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow">
    <input id="url" class="w-full border p-2 mb-4" placeholder="粘贴 Twitter 链接">
    <button onclick="parse()" class="w-full bg-blue-600 text-white p-2 rounded">解析</button>
    <div id="result" class="hidden mt-4">
      <img id="thumb" class="w-full mb-2">
      <h3 id="title" class="font-bold"></h3>
      <div id="formats"></div>
    </div>
  </div>

  <script>
    async function parse() {
      const url = document.getElementById('url').value;
      try {
        const res = await fetch('https://my-downloader-uqa0.onrender.com/download', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ url })
        });
        const data = await res.json();
        
        if (data.status === "error") {
          alert("解析失败: " + data.message);
          console.error("后端详情:", data.message);
        } else {
          document.getElementById('result').classList.remove('hidden');
          document.getElementById('thumb').src = data.thumbnail;
          document.getElementById('title').innerText = data.title;
          document.getElementById('formats').innerHTML = data.formats.map(f => 
            `<a href="${f.url}" target="_blank" class="block bg-blue-100 p-2 my-1">下载 (${f.note})</a>`
          ).join('');
        }
      } catch (err) {
        alert("通信出错，请按 F12 查看控制台");
        console.error(err);
      }
    }
  </script>
</body>
</html>
