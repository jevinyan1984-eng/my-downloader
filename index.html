<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitter 视频下载器</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen py-10">
  <div class="max-w-xl mx-auto bg-white p-8 rounded-2xl shadow-xl">
    <h1 class="text-3xl font-extrabold text-gray-800 mb-6 text-center">Twitter 视频下载器</h1>
    
    <div class="flex gap-2 mb-6">
      <input type="text" id="url" class="flex-1 border-2 border-gray-200 p-3 rounded-lg focus:outline-none focus:border-blue-500 transition" placeholder="粘贴 Twitter 视频链接...">
      <button onclick="parse()" id="parseBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-bold transition">解析</button>
    </div>

    <div id="loading" class="hidden text-center py-4 text-blue-600 font-semibold">正在解析视频，请稍候...</div>

    <div id="result" class="hidden mt-6 border-t pt-6">
      <img id="thumb" class="w-full rounded-lg shadow-md mb-4 border" src="" alt="预览图">
      <h3 id="title" class="text-lg font-bold text-gray-800 mb-4"></h3>
      <div id="formats" class="space-y-3">
        </div>
    </div>
  </div>

  <script>
    async function parse() {
      const url = document.getElementById('url').value;
      if (!url) return alert("请输入链接");

      const btn = document.getElementById('parseBtn');
      const load = document.getElementById('loading');
      const resDiv = document.getElementById('result');
      
      // UI 重置
      btn.disabled = true;
      load.classList.remove('hidden');
      resDiv.classList.add('hidden');

      try {
        const response = await fetch('https://my-downloader-uqa0.onrender.com/download', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ url: url })
        });
        
        const data = await response.json();
        
        if (data.status === "error") {
          alert("解析失败: " + data.message);
        } else {
          resDiv.classList.remove('hidden');
          document.getElementById('thumb').src = data.thumbnail;
          document.getElementById('title').innerText = data.title;
          
          const fDiv = document.getElementById('formats');
          fDiv.innerHTML = data.formats.map(f => `
            <a href="${f.url}" target="_blank" class="flex justify-between items-center bg-gray-100 p-3 rounded-lg hover:bg-blue-50 transition border border-gray-200">
              <span class="font-medium text-gray-700">${f.note || '下载视频'}</span>
              <span class="text-blue-600 font-bold">下载</span>
            </a>
          `).join('');
        }
      } catch (err) {
        alert("服务器通信失败，请检查网络或控制台日志。");
      } finally {
        btn.disabled = false;
        load.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
