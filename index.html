<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>怡烨科技 - Twitter 视频下载器</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen py-10">
  <div class="max-w-xl mx-auto bg-white p-8 rounded-2xl shadow-xl">
    <h1 class="text-3xl font-extrabold text-gray-800 mb-6 text-center">万能视频下载器</h1>
    
    <div class="flex gap-2 mb-6">
      <input type="text" id="url" class="flex-1 border-2 border-gray-200 p-3 rounded-lg focus:outline-none focus:border-blue-500" placeholder="粘贴 Twitter 视频链接...">
      <button onclick="parse()" id="parseBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-bold transition">解析</button>
    </div>

    <div id="result" class="hidden mt-6 border-t pt-6">
      <img id="thumb" class="w-full rounded-lg shadow-md mb-4 border" src="" alt="预览图">
      <h3 id="title" class="text-lg font-bold text-gray-800 mb-4"></h3>
      <div id="formats" class="space-y-3"></div>
    </div>

    <div class="mt-10 pt-6 border-t text-center text-gray-500 text-sm">
      <details class="cursor-pointer group">
        <summary class="list-none hover:text-blue-600 font-medium transition">点击联系作者</summary>
        <div class="mt-4 space-y-2 text-gray-700 animate-in fade-in zoom-in duration-300">
          <p>微信：<span class="font-bold select-all">jevinyan</span></p>
          <p>邮箱：<a href="mailto:jevinyan1984@gmail.com" class="text-blue-600 hover:underline">jevinyan1984@gmail.com</a></p>
        </div>
      </details>
    </div>
  </div>

  <script>
    // 确保这里的地址是你部署在 Render 上的后端域名
    const API_BASE = "https://my-downloader-uqa0.onrender.com";

    async function parse() {
      const url = document.getElementById('url').value;
      if (!url) return alert("请输入链接");

      const btn = document.getElementById('parseBtn');
      const resultDiv = document.getElementById('result');
      
      btn.disabled = true;
      btn.innerText = "解析中...";

      try {
        const response = await fetch(`${API_BASE}/download`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ url })
        });
        
        const data = await response.json();
        
        if (data.status === "success") {
          resultDiv.classList.remove('hidden');
          document.getElementById('thumb').src = data.thumbnail;
          document.getElementById('title').innerText = data.title;
          
          document.getElementById('formats').innerHTML = data.formats.map(f => `
            <a href="${API_BASE}/proxy_download?url=${encodeURIComponent(f.url)}" 
               target="_blank" 
               class="flex justify-between items-center bg-gray-100 p-4 rounded-lg hover:bg-blue-50 transition border border-gray-200">
               <span class="font-medium text-gray-700">${f.note || '下载视频'}</span>
               <span class="text-blue-600 font-bold">点击下载</span>
            </a>
          `).join('');
        } else {
          alert("解析失败: " + data.message);
        }
      } catch (err) {
        alert("系统错误，请确保网络连接正常");
      } finally {
        btn.disabled = false;
        btn.innerText = "解析";
      }
    }
  </script>
</body>
</html>
